# Fly.io config for the SharpCode API (https://sharpcode-api.fly.dev)
app = "sharpcode-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  Database__Path = "/data/sharpcode.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 4
    hard_limit = 8

[[mounts]]
  source = "sharpcode_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
